<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Enter Your Name</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" id="container">
        <form>
            <img src="overlay.png" class="overlay">
            <h2>Enter Your Name</h2>
            <input type="name" id="name" class="name" placeholder="Name" required>
            <button onclick="sayHello()" class="submit" id="submit">Submit</button>
        </form>
        <footer>Created By: ERAZER</footer>
    </div>

    <div class="popup" id="popup">
        <h1 id="showText" class="textanimate">Hi, I hope you are now okay</h1>
        <h1 id="showText2" class="textanimate">Please don't close this window for a while.</h1>
        <audio control autoplay id="music">
            <source src="https://www.youtube.com/watch?v=fMuZx4lFJL8" type="audio/mpeg">
        </audio>
        <button type="close" id="closeButton">Close</button>
    </div>

    <div class="popup" id="error">
        <h1 id="showText2">Please Enter Your Name</h1>
        <button type="close" id="closeButton2">Close</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
